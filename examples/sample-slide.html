<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Sample slide</title>
<style>
  body { margin: 0; width: 1280px; height: 720px; position: relative; background: #0f172a; font-family: Arial, sans-serif; color: #f8fafc; }
  .title { position: absolute; left: 80px; top: 70px; width: 900px; font-size: 56px; font-weight: 700; }
  .subtitle { position: absolute; left: 80px; top: 160px; width: 900px; font-size: 26px; color: #94a3b8; }
  .card { position: absolute; left: 80px; top: 300px; width: 520px; height: 280px; border-radius: 16px; background: linear-gradient(135deg, #6d4aff, #ec4899); }
  .card-text { position: absolute; left: 120px; top: 340px; width: 440px; font-size: 32px; font-weight: 700; }
  .stat { position: absolute; left: 680px; top: 300px; width: 520px; font-size: 96px; font-weight: 700; color: #22c55e; }
  .stat-label { position: absolute; left: 680px; top: 430px; width: 520px; font-size: 24px; color: #cbd5e1; }
</style>
</head>
<body>
  <div class="title">Quarterly review</div>
  <div class="subtitle">Every element on this slide becomes its own editable layer</div>
  <div class="card"></div>
  <div class="card-text">Text stays <em>editable</em> in PowerPoint</div>
  <div class="stat">42%</div>
  <div class="stat-label">Growth in conversions</div>
</body>
</html>
